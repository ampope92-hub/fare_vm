name = "fare-vm"

# The verifier reads only the Pascal sources. It compiles them itself and runs the binary on
# images baked into its own image, so nothing else from the agent's container is needed.
# Must stay top-level: nested under [verifier] the value is silently dropped.
artifacts = ["/app/fvm/src/"]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Languages"
tags = ["pascal", "bytecode-interpreter", "twos-complement", "exception-unwinding", "conformance"]
languages = ["pascal"]
difficulty = "core"
expert_time_estimate_hours = 6

difficulty_explanation = "The task is a clean-room interpreter for a small but fully specified bytecode machine, FVM-2, whose word width and limits come from each image's header, and the difficulty is that many exact rules act on one another inside a single run. Integers are two's complement at any width from 8 to 48 bits, so every result has to be reduced to the header's width, and a wrap changes a comparison that decides a branch; LEN and BYTE wrap too, so on an 8-bit reader a 200 byte string has length -56 and a loop bound read as unsigned runs on. Division floors rather than truncating, the minimum divided by -1 wraps, shift counts are read as unsigned so a negative count is a huge one, and USHR reinterprets its result as signed. EQ across types is 0 while LT across types raises. A raising instruction has already taken its operands, except CALL; errors unwind through frames, cut the operand stack back to the size the handler recorded only when it is larger, and can themselves fault when the stack is full; RET drops the handlers its frame installed. Every instruction is charged ticks before it takes effect, CALL costs the callee's slot count, and string instructions cost one tick per whole 8 bytes of what they produce, which for PRINT means the escaped text, so where a budget runs out depends on the escaping rule. The sheet also fixes the order in which one instruction's faults and raises are checked. None of this needs discovering, but a human expert has to hold several dozen stated rules in mind at once and get every interaction right with no transcript to compare against for most of the suite: an interpreter that is right on the obvious reading of each rule and wrong on one boundary fails a whole class of images. The data is synthetic, generated by a program that builds FVM-2 images, and it is not drawn from any real fare system; the held-back images are programs of the kind a fare rule compiler emits (tap histories folded into zones and capped fares, receipts built up to the string limit, recursive digit sums that run out of frames, sorts of byte strings, check values over card numbers, field lists read with NUM) together with blocks that exercise each instruction on boundary operands."
solution_explanation = "The reference is a direct Free Pascal implementation of the sheet. Integers are held sign-extended in an Int64 and reduced after every operation by masking to W bits and subtracting 2^W when the top bit is set; products are formed in wrapping 64-bit arithmetic, which is still exact modulo 2^W because W is at most 48. Division corrects the truncating div by one when the remainder is nonzero and the signs differ, and MOD is derived from it. Shift counts are masked to W bits and compared with W before shifting; USHR masks the operand, shifts, and reduces. Varints are decoded with the ten-byte and 2^64 limits and redundant zero groups accepted. Each instruction goes through the sheet's order: decode, index checks, operand availability against the current frame's base, the computation (which may raise), stack room, then the tick check, and only then is anything committed, so a faulting instruction has no effect and a raising one is charged a single tick and has taken its operands (CALL excepted, which checks the frame limit first). Raises unwind to the innermost handler, drop the frames above it, cut the stack to the recorded size and push the value, faulting if the stack is full. PRINT renders strings with the backslash and hex escapes and charges for the rendered length. The images and their transcripts were produced by a Python model of the same sheet (shipped in solution/ with the generator), and the Pascal matches it byte for byte on all 131 graded images and on 448 further held-back images from eight other seeds."
verification_explanation = "The verifier compiles the collected /app/fvm/src with the fpc command the instruction states, as an unprivileged user, checks that the generated link script names only fpc's own objects and run-time units, and then runs the binary once per image under a seccomp launcher that refuses a second process and anonymous executables, with every other program on the box closed, no writable directory, and 10 seconds per image. It runs the 75 conformance images first and then the 56 held-back images, which are staged only after the conformance runs are over; standard output is captured to root-only files and compared byte for byte with the expected transcripts kept root-only in the verifier image, one test per image, and the reward is 1 only if all 131 match. The conformance suite has one image per rule of the sheet, each built as the hard case of that rule, so each rule is enforced on the visible suite on its own. The held-back suite is generated with other word widths (8, 9, 10, 13, 20, 24, 27, 40 and 48 bits), stack, frame, string and tick limits, several programs on exactly the tick budget they need or a few ticks short, and some images using redundant varint encodings, so neither transcripts copied into the source nor an interpreter tuned to the visible widths can pass. Seventeen one-line mutants of the reference, each taking one rule the plausible wrong way, all score 0 through this verifier: each fails its own conformance image and more of the held-back images, for example truncating division 1 and 14, signed ULT 1 and 18, shift count modulo W 1 and 15, a tick budget read with >= 5 and 15, raw instead of escaped PRINT cost 2 and 22, handlers kept across RET 1 and 7, operands left on the stack by a raising instruction 2 and 7, branch offsets reduced to W 1 and 4."
relevant_experience = "I have worked on language runtimes and on the embedded payment terminals side of transit ticketing, including writing interpreters and conformance suites for small bytecode machines where the device and the back office have to agree on every transcript."

[verifier]
# One compile and 131 short runs of the agent's binary; 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the interpreter is written against the Free Pascal run-time units only.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: the image build and the harness
# install happen in this phase.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
